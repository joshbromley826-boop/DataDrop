<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataDrop — Automated Price Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(12px); border: 1px solid #30363d; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-gray-800">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-3xl">💧</span>
                    <h1 class="text-3xl font-bold text-white tracking-tight">DataDrop Dashboard</h1>
                </div>
                <p class="text-gray-400 text-sm mt-1">Live market report feed and automated tracking analytics</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-2 px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Sync Enabled
                </span>
                <button onclick="loadCSVData()" class="glass hover:bg-gray-800 text-sm text-gray-200 px-4 py-2 rounded-lg transition">
                    🔄 Refresh Data
                </button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass p-5 rounded-xl">
                <div class="text-gray-400 text-xs font-medium uppercase tracking-wider">Tracked Products</div>
                <div class="text-2xl font-bold text-white mt-1" id="product-count">0 Items</div>
            </div>
            <div class="glass p-5 rounded-xl">
                <div class="text-gray-400 text-xs font-medium uppercase tracking-wider">Latest Update</div>
                <div class="text-2xl font-bold text-emerald-400 mt-1" id="time-display">Loading...</div>
            </div>
            <div class="glass p-5 rounded-xl">
                <div class="text-gray-400 text-xs font-medium uppercase tracking-wider">Default Currency</div>
                <div class="text-2xl font-bold text-white mt-1" id="currency-display">GBP (£)</div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="glass rounded-xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Live Market Report</h2>
                <span class="text-xs text-gray-400">market_price_report.csv</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-800/50 text-xs uppercase text-gray-400 border-b border-gray-800">
                        <tr>
                            <th class="p-4">Product Name</th>
                            <th class="p-4">Price</th>
                            <th class="p-4">Currency</th>
                            <th class="p-4">Last Updated</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="csv-table-body" class="divide-y divide-gray-800/50">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">Loading CSV data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadCSVData() {
            try {
                // Fetch the CSV file generated by your Python engine
                const response = await fetch('market_price_report.csv?t=' + new Date().getTime());
                if (!response.ok) throw new Error("CSV file not found");
                
                const data = await response.text();
                const lines = data.trim().split('\n');
                if (lines.length <= 1) return;

                const tbody = document.getElementById('csv-table-body');
                tbody.innerHTML = ''; // Clear loading row

                let count = 0;
                let lastTime = '';
                let detectedCurrency = 'GBP';

                // Skip header line (index 0) and process rows
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const cols = line.split(',');
                    const name = cols[0] || 'Unknown Product';
                    const price = cols[1] || '0.00';
                    const currency = cols[2] || 'GBP';
                    const updated = cols[3] || 'N/A';
                    const status = cols[4] || 'Live';

                    count++;
                    lastTime = updated;
                    detectedCurrency = currency;

                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-800/30 transition';
                    row.innerHTML = `
                        <td class="p-4 font-medium text-white">${name}</td>
                        <td class="p-4 font-semibold text-emerald-400">£${price}</td>
                        <td class="p-4 text-gray-400">${currency}</td>
                        <td class="p-4 text-gray-400">${updated}</td>
                        <td class="p-4"><span class="px-2 py-1 text-xs rounded bg-emerald-500/10 text-emerald-400 font-medium">${status}</span></td>
                    `;
                    tbody.appendChild(row);
                }

                // Update summary dashboard stats
                document.getElementById('product-count').innerText = `${count} Items`;
                document.getElementById('time-display').innerText = lastTime || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('currency-display').innerText = `${detectedCurrency} (£)`;

            } catch (err) {
                console.error("Error reading CSV:", err);
                document.getElementById('csv-table-body').innerHTML = `
                    <tr>
                        <td colspan="5" class="p-4 text-center text-red-400">
                            Unable to load market_price_report.csv. Ensure price_tracker.py has generated it.
                        </td>
                    </tr>
                `;
            }
        }

        // Auto load on start
        loadCSVData();
    </script>
</body>
</html>
